spring.application.name=fnb-recommender-system

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/fnb_recommender_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.demo=DEBUG

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=never

# Spring Security (basic config)
spring.security.user.name=admin
spring.security.user.password=admin

# SpringDoc OpenAPI (Swagger UI)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# JWT Configuration
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-in-production-please-use-at-least-32-characters}
jwt.access-token-expiry=900000
jwt.refresh-token-expiry=604800000

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# OAuth2 Configuration (Set these in production or disable OAuth2 if not needed)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-client-id-replace-in-production}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-client-secret-replace-in-production}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_APP_ID:dummy-app-id-replace-in-production}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_APP_SECRET:dummy-app-secret-replace-in-production}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# Application Configuration
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.token.verification-expiry=86400000
app.token.reset-expiry=3600000
