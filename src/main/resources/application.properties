spring.application.name=fnb-recommender-system

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/fnb_recommender_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Enable JSONB support with Hypersistence Utils
spring.jpa.properties.hibernate.type.json_format_mapper=io.hypersistence.utils.hibernate.type.json.JacksonJSONFormatMapper

# Jackson Configuration for JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.example.demo=DEBUG

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-stacktrace=never

# Spring Security (basic config)
spring.security.user.name=admin
spring.security.user.password=admin
